# EVERFOREST DARK THEME FOR HYPRLOCK

background {
    monitor =
    path = /home/falco/Pictures/Wallpapers/fog_forest_1.png
    # Using the standard Everforest dark background color as a fallback
    color = rgb(2d353b) 
    
    # Blur effect for the background (if using an image or screenshot)
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    
    # Dots configuration
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    
    # Everforest Colors
    outer_color = rgb(a7c080)        # Everforest Green
    inner_color = rgb(2d353b)        # Everforest Background
    font_color = rgb(d3c6aa)         # Everforest Foreground/Text
    fail_color = rgb(e67e80)         # Everforest Red for failure
    
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    rounding = -1
    check_color = rgb(dbbc7f)        # Everforest Yellow for checking state
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    
    position = 0, -120
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(d3c6aa)
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    
    position = 0, 80
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(d3c6aa)
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    
    position = 0, -10
    halign = center
    valign = center
}